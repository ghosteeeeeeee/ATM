<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Continuum Engine — BTC</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: monospace; background: #0a0a0f; color: #e0e0e0; padding: 20px; font-size: 0.85em; }
    h1 { color: #00ff88; font-size: 1.4em; margin-bottom: 15px; border-bottom: 1px solid #00ff8833; padding-bottom: 10px; }
    h1 .subtitle { color: #666; font-size: 0.6em; font-weight: normal; margin-left: 12px; }

    /* Stats bar */
    .stats-bar { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
    .stat { background: #1a1a2e; padding: 10px 14px; border-radius: 4px; border-left: 3px solid #00ff88; min-width: 120px; }
    .stat .label { color: #666; font-size: 0.75em; }
    .stat .value { color: #00ff88; font-size: 1.1em; font-weight: bold; }
    .stat .value.bearish { color: #ff4444; }
    .stat .value.neutral { color: #888; }
    .stat .value.bullish { color: #00ff88; }

    /* Score gauge */
    .gauge-container { display: flex; gap: 20px; margin-bottom: 20px; }
    .gauge { background: #1a1a2e; border-radius: 8px; padding: 20px; flex: 1; text-align: center; }
    .gauge .gauge-label { color: #666; font-size: 0.8em; margin-bottom: 8px; }
    .gauge .gauge-value { font-size: 2.5em; font-weight: bold; }
    .gauge .gauge-bar { width: 100%; height: 8px; background: #333; border-radius: 4px; margin-top: 10px; position: relative; }
    .gauge .gauge-fill { height: 8px; border-radius: 4px; transition: width 0.3s; }
    .gauge .gauge-marker { position: absolute; top: -4px; width: 2px; height: 16px; background: #fff; }

    /* State grid */
    .state-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .state-card { background: #1a1a2e; border-radius: 6px; padding: 12px; border-left: 3px solid #333; }
    .state-card.active { border-left-color: #00ff88; }
    .state-card.warning { border-left-color: #ffaa00; }
    .state-card.danger { border-left-color: #ff4444; }
    .state-card .state-name { color: #666; font-size: 0.75em; margin-bottom: 4px; }
    .state-card .state-value { color: #e0e0e0; font-size: 1em; font-weight: bold; }
    .state-card .state-detail { color: #888; font-size: 0.75em; margin-top: 4px; }

    /* Linreg slopes */
    .slope-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
    .slope-card { background: #1a1a2e; border-radius: 6px; padding: 12px; text-align: center; }
    .slope-card .tf { color: #666; font-size: 0.75em; }
    .slope-card .slope-val { font-size: 1.3em; font-weight: bold; margin: 4px 0; }
    .slope-card .slope-dir { font-size: 0.8em; padding: 2px 8px; border-radius: 10px; display: inline-block; }
    .slope-up { color: #00ff88; background: #00ff8822; }
    .slope-down { color: #ff4444; background: #ff444422; }
    .slope-flat { color: #888; background: #88888822; }

    /* Position */
    .position-box { background: #1a1a2e; border-radius: 6px; padding: 15px; margin-bottom: 20px; border-left: 3px solid #333; }
    .position-box.has-position { border-left-color: #00ff88; }
    .position-box .pos-header { color: #666; font-size: 0.8em; margin-bottom: 8px; }
    .position-box .pos-side { font-size: 1.2em; font-weight: bold; }
    .position-box .pos-side.long { color: #00ff88; }
    .position-box .pos-side.short { color: #ff4444; }
    .position-box .pos-side.none { color: #444; }

    /* History chart (simple ASCII-style) */
    .chart-container { background: #1a1a2e; border-radius: 6px; padding: 15px; margin-bottom: 20px; }
    .chart-header { color: #666; font-size: 0.8em; margin-bottom: 10px; }
    .chart-canvas { width: 100%; height: 200px; }

    /* Log */
    .log-container { background: #1a1a2e; border-radius: 6px; padding: 15px; max-height: 300px; overflow-y: auto; }
    .log-header { color: #666; font-size: 0.8em; margin-bottom: 10px; }
    .log-entry { padding: 3px 0; border-bottom: 1px solid #222; font-size: 0.8em; }
    .log-entry .log-time { color: #666; }
    .log-entry .log-event { color: #e0e0e0; }
    .log-entry .log-entry-signal { color: #00ff88; }
    .log-entry .log-exit-signal { color: #ff4444; }
    .log-entry .log-phase { color: #ffaa00; }

    #status { color: #666; font-size: 0.75em; margin-bottom: 15px; }
  </style>
</head>
<body>
  <h1>🌊 Continuum Engine <span class="subtitle">BTC State Machine</span></h1>
  <div id="status">Loading...</div>

  <!-- Stats bar -->
  <div class="stats-bar" id="stats-bar"></div>

  <!-- Score gauge -->
  <div class="gauge-container" id="gauges"></div>

  <!-- Current state cards -->
  <div class="state-grid" id="state-grid"></div>

  <!-- Linear regression slopes -->
  <h2 style="color:#00ff88; font-size:1em; margin-bottom:10px;">📈 Linear Regression Slopes</h2>
  <div class="slope-grid" id="slope-grid"></div>

  <!-- Position -->
  <div class="position-box" id="position-box"></div>

  <!-- Score history chart -->
  <div class="chart-container">
    <div class="chart-header">SCORE HISTORY (24h)</div>
    <canvas id="score-chart" class="chart-canvas"></canvas>
  </div>

  <!-- Event log -->
  <div class="log-container">
    <div class="log-header">EVENT LOG</div>
    <div id="event-log"></div>
  </div>

<script>
const DATA_URL = '/data/continuum_data.json';
let data = null;

async function fetchData() {
  try {
    const resp = await fetch(DATA_URL + '?t=' + Date.now());
    data = await resp.json();
    render();
    document.getElementById('status').textContent = `Last update: ${data.updated_at_str} | ${data.stats.total_ticks || 0} ticks`;
  } catch (e) {
    document.getElementById('status').textContent = 'Error loading data: ' + e.message;
  }
}

function render() {
  if (!data || !data.current) {
    document.getElementById('status').textContent = 'No data available';
    return;
  }
  const c = data.current;

  // Stats bar
  const statsHtml = [
    stat('Price', '$' + fmt(c.price)),
    stat('EMA300', c.ema300_position, c.ema300_duration + 'm',
         c.ema300_position === 'ABOVE' ? 'bullish' : c.ema300_position === 'BELOW' ? 'bearish' : 'neutral'),
    stat('Z-Score', c.zscore_tier, '(' + (c.zscore_val >= 0 ? '+' : '') + c.zscore_val.toFixed(2) + ')',
         c.zscore_tier.includes('POS') ? 'bullish' : c.zscore_tier.includes('NEG') ? 'bearish' : 'neutral'),
    stat('Volume', c.volume_regime, c.volume_ratio_val.toFixed(1) + 'x',
         c.volume_regime === 'PARABOLIC' ? 'bullish' : c.volume_regime === 'HIGH' ? 'bullish' : 'neutral'),
    stat('Phase', 'Phase ' + c.entry_phase, c.entry_phase === 4 ? 'ACTIVE' : ''),
    stat('Ticks', data.stats.total_ticks || 0),
  ];
  document.getElementById('stats-bar').innerHTML = statsHtml.join('');

  // Score gauge
  const score = c.state_score || 50;
  const scoreColor = score >= 70 ? '#00ff88' : score >= 50 ? '#ffaa00' : score >= 30 ? '#ff8844' : '#ff4444';
  document.getElementById('gauges').innerHTML = `
    <div class="gauge">
      <div class="gauge-label">COMPOUND SCORE</div>
      <div class="gauge-value" style="color:${scoreColor}">${score.toFixed(1)}</div>
      <div class="gauge-bar">
        <div class="gauge-fill" style="width:${score}%; background:${scoreColor}"></div>
        <div class="gauge-marker" style="left:30%"></div>
        <div class="gauge-marker" style="left:50%"></div>
        <div class="gauge-marker" style="left:70%"></div>
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:5px;font-size:0.7em;color:#666">
        <span>0</span><span>30</span><span>50</span><span>70</span><span>100</span>
      </div>
    </div>
    <div class="gauge">
      <div class="gauge-label">LINREG ALIGNMENT</div>
      <div class="gauge-value" style="color:${c.linreg_alignment > 0.5 ? '#00ff88' : '#888'}">${(c.linreg_alignment * 100).toFixed(0)}%</div>
      <div style="margin-top:8px;font-size:0.9em;color:${c.linreg_direction === 'BULL' ? '#00ff88' : c.linreg_direction === 'BEAR' ? '#ff4444' : '#888'}">${c.linreg_direction}</div>
    </div>
  `;

  // State cards
  const states = [
    { name: 'EMA300 Position', value: c.ema300_position, detail: c.ema300_duration + ' min', cls: c.ema300_position === 'ABOVE' ? 'active' : c.ema300_position === 'BELOW' ? 'danger' : '' },
    { name: 'Z-Score Tier', value: c.zscore_tier, detail: c.zscore_val.toFixed(2), cls: c.zscore_tier.includes('STRONG') ? (c.zscore_tier.includes('POS') ? 'active' : 'danger') : '' },
    { name: 'Volume Regime', value: c.volume_regime, detail: c.volume_ratio_val.toFixed(1) + 'x avg', cls: c.volume_regime === 'PARABOLIC' ? 'active' : c.volume_regime === 'HIGH' ? 'warning' : '' },
    { name: 'Velocity', value: c.velocity_state, detail: c.velocity_val.toFixed(3) + '%', cls: c.velocity_state === 'RISING' || c.velocity_state === 'FAST' ? 'active' : c.velocity_state === 'FALLING' ? 'danger' : '' },
    { name: 'Acceleration', value: c.acceleration_state, detail: c.acceleration_val.toFixed(4), cls: c.acceleration_state === 'POSITIVE' ? 'active' : c.acceleration_state === 'NEGATIVE' ? 'danger' : '' },
    { name: 'Linreg Slope', value: c.linreg_slope_state, detail: c.linreg_1m_slope.toFixed(4) + '%/candle', cls: c.linreg_slope_state === 'UP' || c.linreg_slope_state === 'STEEP_UP' ? 'active' : c.linreg_slope_state === 'DOWN' || c.linreg_slope_state === 'STEEP_DOWN' ? 'danger' : '' },
    { name: 'Wyckoff', value: c.wyckoff_phase, detail: '', cls: c.wyckoff_phase === 'MARKUP' ? 'active' : c.wyckoff_phase === 'MARKDOWN' ? 'danger' : '' },
    { name: 'Elliott Wave', value: c.ewave_count, detail: '', cls: c.ewave_count === 'W3' ? 'active' : '' },
    { name: 'Trend Quality', value: c.trend_quality, detail: '', cls: c.trend_quality.includes('UP') ? 'active' : c.trend_quality.includes('DOWN') ? 'danger' : '' },
    { name: 'Market Phase', value: c.market_phase, detail: '', cls: c.market_phase === 'RECOVERY' ? 'active' : c.market_phase === 'DECLINING' ? 'danger' : '' },
  ];
  document.getElementById('state-grid').innerHTML = states.map(s => `
    <div class="state-card ${s.cls}">
      <div class="state-name">${s.name}</div>
      <div class="state-value">${s.value}</div>
      ${s.detail ? `<div class="state-detail">${s.detail}</div>` : ''}
    </div>
  `).join('');

  // Slope grid
  const slopes = [
    { tf: '1m', slope: c.linreg_1m_slope, period: '60 candles' },
    { tf: '5m', slope: c.linreg_5m_slope, period: '12 candles' },
    { tf: '15m', slope: c.linreg_15m_slope, period: '8 candles' },
    { tf: '1h', slope: c.linreg_1h_slope, period: '6 candles' },
  ];
  document.getElementById('slope-grid').innerHTML = slopes.map(s => {
    const cls = s.slope > 0.02 ? 'slope-up' : s.slope < -0.02 ? 'slope-down' : 'slope-flat';
    const dir = s.slope > 0.02 ? '↑ UP' : s.slope < -0.02 ? '↓ DOWN' : '→ FLAT';
    return `
      <div class="slope-card">
        <div class="tf">${s.tf} (${s.period})</div>
        <div class="slope-val ${cls}">${s.slope >= 0 ? '+' : ''}${s.slope.toFixed(4)}%</div>
        <div class="slope-dir ${cls}">${dir}</div>
      </div>
    `;
  }).join('');

  // Position
  const pos = c.position_side || 'NONE';
  const posCls = pos === 'LONG' ? 'long' : pos === 'SHORT' ? 'short' : 'none';
  document.getElementById('position-box').innerHTML = `
    <div class="pos-header">POSITION</div>
    <div class="pos-side ${posCls}">${pos} ${pos !== 'NONE' ? '(' + c.position_size_pct.toFixed(0) + '%)' : ''}</div>
    <div style="color:#666;font-size:0.8em;margin-top:4px">Entry Phase: ${c.entry_phase} | Score: ${c.state_score.toFixed(1)}</div>
  `;
  document.getElementById('position-box').className = 'position-box' + (pos !== 'NONE' ? ' has-position' : '');

  // Score chart
  drawChart();

  // Event log
  drawLog();
}

function drawChart() {
  const canvas = document.getElementById('score-chart');
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.offsetWidth;
  canvas.height = 200;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (!data.history || data.history.length < 2) {
    ctx.fillStyle = '#444';
    ctx.fillText('No history data', 10, 100);
    return;
  }

  const w = canvas.width, h = canvas.height;
  const padding = { top: 10, right: 10, bottom: 20, left: 30 };
  const plotW = w - padding.left - padding.right;
  const plotH = h - padding.top - padding.bottom;

  // Draw grid
  ctx.strokeStyle = '#222';
  ctx.lineWidth = 0.5;
  for (let y = 0; y <= 100; y += 20) {
    const py = padding.top + plotH - (y / 100 * plotH);
    ctx.beginPath();
    ctx.moveTo(padding.left, py);
    ctx.lineTo(w - padding.right, py);
    ctx.stroke();
    ctx.fillStyle = '#666';
    ctx.font = '10px monospace';
    ctx.fillText(y, 2, py + 3);
  }

  // Threshold lines
  ctx.strokeStyle = '#00ff8844';
  ctx.setLineDash([4, 4]);
  [30, 50, 70].forEach(t => {
    const py = padding.top + plotH - (t / 100 * plotH);
    ctx.beginPath();
    ctx.moveTo(padding.left, py);
    ctx.lineTo(w - padding.right, py);
    ctx.stroke();
  });
  ctx.setLineDash([]);

  // Plot score
  const history = data.history;
  const dx = plotW / (history.length - 1);
  ctx.beginPath();
  ctx.strokeStyle = '#00ff88';
  ctx.lineWidth = 1.5;
  history.forEach((h, i) => {
    const x = padding.left + i * dx;
    const y = padding.top + plotH - ((h.state_score || 50) / 100 * plotH);
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.stroke();

  // Fill under curve
  ctx.lineTo(padding.left + (history.length - 1) * dx, padding.top + plotH);
  ctx.lineTo(padding.left, padding.top + plotH);
  ctx.closePath();
  ctx.fillStyle = '#00ff8811';
  ctx.fill();
}

function drawLog() {
  if (!data.history) return;
  const entries = data.history.slice(-50).reverse();
  document.getElementById('event-log').innerHTML = entries.map(e => {
    let cls = '';
    let event = `Score: ${e.state_score.toFixed(1)} | EMA: ${e.ema300_position}(${e.ema300_duration}m) | Z: ${e.zscore_tier}`;
    if (e.entry_phase === 4 && e.position_side !== 'NONE') {
      cls = 'log-entry-signal';
      event += ` | ★ ${e.position_side} ACTIVE`;
    }
    return `<div class="log-entry"><span class="log-time">${e.ts_str}</span> <span class="${cls}">${event}</span></div>`;
  }).join('');
}

function stat(label, value, detail, cls) {
  return `<div class="stat"><div class="label">${label}</div><div class="value ${cls || ''}">${value}</div>${detail ? `<div style="color:#888;font-size:0.75em">${detail}</div>` : ''}</div>`;
}

function fmt(n) {
  return n ? n.toLocaleString(undefined, {minimumFractionDigits: 0, maximumFractionDigits: 0}) : '0';
}

// Auto-refresh
fetchData();
setInterval(fetchData, 15000);

// Resize chart on window resize
window.addEventListener('resize', () => { if (data) drawChart(); });
</script>
</body>
</html>
