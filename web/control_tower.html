<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes Control Tower</title>
<style>
:root {
  --bg: #0a0a0f; --card: #12121a; --border: #1e1e2e;
  --text: #c0c0d0; --dim: #666; --accent: #4fc3f7;
  --green: #4caf50; --red: #ef5350; --orange: #ff9800; --yellow: #fdd835; --purple: #ab47bc;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:'JetBrains Mono',monospace; font-size:13px; padding:12px; }
h1 { color:var(--accent); font-size:18px; margin-bottom:6px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
h1 .sub { color:var(--dim); font-size:11px; font-weight:normal; }
.badge { font-size:11px; padding:2px 8px; border-radius:10px; border:1px solid var(--border); }
.badge.fresh { color:var(--green); border-color:var(--green); }
.badge.stale { color:var(--red); border-color:var(--red); animation:blink 1.2s infinite; }
@keyframes blink { 50% { opacity:.4; } }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:8px; margin:10px 0; }
.stat { background:var(--card); border:1px solid var(--border); border-radius:6px; padding:8px 10px; }
.stat .n { font-size:22px; color:var(--accent); font-weight:bold; }
.stat .l { color:var(--dim); font-size:10px; text-transform:uppercase; letter-spacing:1px; }
h2 { color:var(--accent); font-size:13px; margin:16px 0 6px; text-transform:uppercase; letter-spacing:1px; }
h2.red { color:var(--red); } h2.orange { color:var(--orange); } h2.yellow { color:var(--yellow); } h2.green { color:var(--green); }
.item { background:var(--card); border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:6px; padding:8px 10px; margin-bottom:6px; }
.item.od { border-left-color:var(--red); } .item.d24 { border-left-color:var(--orange); } .item.d7 { border-left-color:var(--yellow); }
.item .head { display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; }
.item .date { color:var(--accent); font-weight:bold; }
.item .id { color:#fff; font-weight:bold; }
.item .owner { color:var(--dim); font-size:11px; }
.item .bar { color:var(--text); font-size:12px; margin-top:4px; }
.item .prog { font-size:12px; margin-top:2px; }
.item .prog.ok { color:var(--green); } .item .prog.no { color:var(--red); }
.item .def { color:var(--dim); font-size:11px; margin-top:3px; font-style:italic; }
table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--border); border-radius:6px; }
td, th { padding:6px 9px; border-bottom:1px solid var(--border); text-align:left; font-size:12px; vertical-align:top; }
th { color:var(--dim); text-transform:uppercase; font-size:10px; letter-spacing:1px; }
tr:last-child td { border-bottom:none; }
td.dt { color:var(--accent); white-space:nowrap; font-weight:bold; }
.packet { background:var(--card); border:1px solid var(--border); border-radius:6px; padding:6px 9px; margin-bottom:4px; font-size:11px; color:#9aa; word-break:break-word; }
details { margin-top:8px; } summary { cursor:pointer; color:var(--dim); font-size:12px; }
.done-list { color:var(--dim); font-size:11px; margin-top:6px; line-height:1.7; word-break:break-word; }
#updated { color:var(--dim); font-size:11px; margin-top:14px; border-top:1px solid var(--border); padding-top:8px; }
.err { color:var(--red); padding:14px; border:1px solid var(--red); border-radius:6px; }
/* ── month calendar view ── */
.calwrap { background:var(--card); border:1px solid var(--border); border-radius:6px; padding:10px; }
.calhead { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
.caltitle { color:var(--accent); font-weight:bold; letter-spacing:1px; }
.calnav { display:flex; gap:6px; }
.calnav button { background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:4px; padding:2px 10px; cursor:pointer; font-family:inherit; font-size:12px; }
.calnav button:hover { border-color:var(--accent); color:var(--accent); }
.calgrid { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
.caldow { color:var(--dim); font-size:10px; text-transform:uppercase; text-align:center; padding-bottom:2px; }
.cell { min-height:76px; background:var(--bg); border:1px solid var(--border); border-radius:5px; padding:4px 5px; position:relative; }
.cell.empty { background:transparent; border-color:transparent; }
.cell .dnum { color:var(--dim); font-size:11px; font-weight:bold; }
.cell.has .dnum { color:var(--text); }
.cell.today { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
.cell.today .dnum { color:var(--accent); }
.cell.od  { border-left:3px solid var(--red); background:rgba(239,83,80,.07); }
.cell.d1  { border-left:3px solid var(--orange); background:rgba(255,152,0,.07); }
.cell.d7  { border-left:3px solid var(--yellow); background:rgba(253,216,53,.06); }
.cell.later { border-left:3px solid var(--accent); }
.chips { margin-top:4px; display:flex; flex-direction:column; gap:2px; }
.chip { font-size:9.5px; line-height:1.3; color:var(--text); background:var(--card); border:1px solid var(--border); border-radius:3px; padding:1px 4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cell.od .chip { border-color:var(--red); color:#f5b7b5; }
.cell.d1 .chip { border-color:var(--orange); color:#ffd9a0; }
.chip.more { color:var(--dim); border-style:dashed; }
</style>
</head>
<body>
<h1>🗼 CONTROL TOWER <span class="sub">shadows · trials · decision calendar</span> <span id="fresh" class="badge">…</span></h1>
<div id="main"><div class="err">loading feed…</div></div>
<div id="updated">—</div>

<script>
const SEC_META = [
  ['overdue', '🔴 OVERDUE — default fires; override needs decision + evidence ≤24h', 'od'],
  ['due24', '🟠 DUE ≤24h', 'd24'],
  ['due7',  '🟡 DUE ≤7d', 'd7'],
  ['due14', '📅 DUE 8–14d', ''],
  ['later', 'LATER (>14d)', ''],
  ['undated', '⚠️ OPEN WITHOUT DEADLINE', '']
];
function esc(s){ const d=document.createElement('div'); d.textContent=String(s??''); return d.innerHTML; }
function itemHtml(e){
  const p = e.progress;
  let prog = '';
  if (p) {
    const cls = p.met===true?'ok':(p.met===false?'no':'');
    prog = `<div class="prog ${cls}">▸ progress: ${esc(p.text)}</div>`;
  }
  return `<div class="item ${SEC_META.find(m=>m[0]===currentSec)?.[2]||''}">
    <div class="head"><span class="date">${esc(e.tag)} · ${esc((e.deadline||'undated').slice(0,10))}</span>
    <span class="id">${esc(e.id)}</span><span class="owner">owner: ${esc(e.owner)}</span></div>
    ${e.bar?`<div class="bar">bar: ${esc(e.bar)}</div>`:''}
    ${prog}
    ${e.default_action?`<div class="def">if silent: ${esc(e.default_action)}</div>`:''}
  </div>`;
}
let currentSec = '';
/* ── month calendar view (T request 2026-11-02): pure client-side render of
   the feed's calendar[] rows; offset persists across 30s polls so nav works. */
let calOffset = 0, calData = [];
const MONTH_NAMES = ['January','February','March','April','May','June','July',
                     'August','September','October','November','December'];
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function pad2(n){ return n<10 ? '0'+n : ''+n; }
function calNav(dir){ calOffset = (dir===0) ? 0 : calOffset+dir; const b=document.getElementById('calbox'); if (b) b.innerHTML = monthGrid(); }
function monthGrid(){
  const now = new Date();
  const base = new Date(now.getFullYear(), now.getMonth()+calOffset, 1);
  const y = base.getFullYear(), m = base.getMonth();
  const byDate = {};
  for (const r of calData) byDate[r.date] = r;
  const firstDow = new Date(y, m, 1).getDay();          // 0=Sun
  const daysIn = new Date(y, m+1, 0).getDate();
  const todayStr = now.getFullYear()+'-'+pad2(now.getMonth()+1)+'-'+pad2(now.getDate());
  let cells = DOW.map(x=>`<div class="caldow">${x}</div>`).join('');
  for (let i=0;i<firstDow;i++) cells += '<div class="cell empty"></div>';
  for (let day=1; day<=daysIn; day++){
    const ds = y+'-'+pad2(m+1)+'-'+pad2(day);
    const r = byDate[ds];
    const dl = r ? r.days_left : null;
    let cls = 'cell';
    if (r){
      cls += ' has';
      if (dl < 0) cls += ' od';
      else if (dl <= 1) cls += ' d1';                    // due today/24h
      else if (dl <= 7) cls += ' d7';
      else cls += ' later';
    }
    if (ds === todayStr) cls += ' today';
    let chips = '';
    if (r){
      const show = r.ids.slice(0, 5);
      chips = '<div class="chips">'
        + show.map(x=>`<div class="chip" title="${esc(x)}">${esc(x)}</div>`).join('')
        + (r.ids.length>5 ? `<div class="chip more">+${r.ids.length-5} more</div>` : '')
        + '</div>';
    }
    const tag = r ? ` · ${esc(r.tag)}` : '';
    cells += `<div class="${cls}"><span class="dnum">${day}${tag}</span>${chips}</div>`;
  }
  const nav = `<div class="calnav">
      <button onclick="calNav(-1)" title="previous month">‹</button>
      <button onclick="calNav(0)" title="back to current month">today</button>
      <button onclick="calNav(1)" title="next month">›</button></div>`;
  const legend = `<div class="sub" style="color:var(--dim);font-size:10px;margin-top:6px">
      red = overdue · orange = ≤24h · yellow = ≤7d · blue = later · items per day from the live registry</div>`;
  return `<div class="calhead"><span class="caltitle">📅 ${MONTH_NAMES[m]} ${y}</span>${nav}</div>
    <div class="calgrid">${cells}</div>${legend}`;
}
function render(d){
  const c = d.counts||{};
  const staleJson = (Date.now() - Date.parse(d.generated_at)) > 10*60*1000;
  const isStale = d.tower_stale || staleJson || d.error;
  const fresh = document.getElementById('fresh');
  fresh.textContent = isStale ? 'STALE' : 'FRESH';
  fresh.className = 'badge ' + (isStale ? 'stale' : 'fresh');

  let h = `<div class="grid">
    <div class="stat"><div class="n">${c.open??'?'}</div><div class="l">open decisions</div></div>
    <div class="stat"><div class="n">${c.done??'?'}</div><div class="l">done / reverted</div></div>
    <div class="stat"><div class="n">${(d.trials||[]).length}</div><div class="l">trials running</div></div>
    <div class="stat"><div class="n">${(d.calendar||[]).length}</div><div class="l">calendar days</div></div>
  </div>`;
  if (d.error) h += `<div class="err">feed error: ${esc(d.error)}</div>`;
  if (d.tower_stale) h += `<div class="err">daily tower render &gt;26h old — the 08:15 timer may have missed a cycle</div>`;

  calData = d.calendar || [];
  h += `<h2>📅 CALENDAR VIEW</h2><div class="calwrap" id="calbox">${monthGrid()}</div>`;

  const S = d.sections||{};
  for (const [key, title] of SEC_META){
    const list = S[key]||[];
    if (!list.length) continue;
    currentSec = key;
    h += `<h2 class="${key==='overdue'?'red':key==='due24'?'orange':key==='due7'?'yellow':''}">${title} (${list.length})</h2>`;
    for (const e of list) h += itemHtml(e);
  }

  const T = d.trials||[];
  if (T.length){
    currentSec='trials';
    h += `<h2>⚗️ RUNNING TRIALS (${T.length})</h2>`;
    for (const e of T){
      const p=e.progress;
      const cls = p? (p.met===true?'ok':(p.met===false?'no':'')) : '';
      h += `<div class="item"><div class="head"><span class="id">${esc(e.id)}</span>
        <span class="owner">due ${esc((e.deadline||'').slice(0,10))} · owner: ${esc(e.owner)}</span></div>
        ${e.bar?`<div class="bar">bar: ${esc(e.bar)}</div>`:''}
        ${p?`<div class="prog ${cls}">▸ ${esc(p.text)}</div>`:''}</div>`;
    }
  }

  const C = d.calendar||[];
  if (C.length){
    h += `<h2>📅 CALENDAR — date-ordered</h2><table><tr><th>Date</th><th></th><th>Items due</th></tr>`;
    for (const row of C){
      const cls = row.tag==='TODAY'||row.tag.startsWith('OVERDUE') ? 'style="color:var(--red)"' :
                  (row.days_left!==undefined && row.days_left<=3 ? 'style="color:var(--orange)"' : '');
      h += `<tr><td class="dt" ${cls}>${esc(row.date)}</td><td ${cls}>${esc(row.tag)}</td><td>${row.ids.map(esc).join(', ')}</td></tr>`;
    }
    h += `</table>`;
  }

  const P = d.packets||[];
  if (P.length){
    h += `<h2>📨 RECENT PACKETS (kanban)</h2>`;
    for (const ln of P) h += `<div class="packet">${esc(ln)}</div>`;
  }

  const D = d.done||[];
  if (D.length){
    h += `<details><summary>✅ DONE / REVERTED (${D.length}) — show</summary><div class="done-list">${D.map(esc).join(' · ')}</div></details>`;
  }

  document.getElementById('main').innerHTML = h;
  const gen = d.generated_at ? new Date(d.generated_at) : null;
  document.getElementById('updated').textContent =
    `feed generated ${gen?gen.toUTCString():'?'} · registry ${d.registry_mtime?new Date(d.registry_mtime).toUTCString():'?'} · tower ${d.tower_mtime?new Date(d.tower_mtime).toUTCString():'?'} · page polls every 30s`;
}
async function tick(){
  try {
    const r = await fetch('/data/control_tower.json?_=' + Date.now(), {cache:'no-store'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    render(await r.json());
  } catch (e) {
    const fresh = document.getElementById('fresh');
    fresh.textContent = 'FEED DOWN'; fresh.className = 'badge stale';
    document.getElementById('main').innerHTML =
      `<div class="err">feed unreachable: ${esc(e.message)} — retrying in 30s</div>`;
  }
}
tick();
setInterval(tick, 30000);
</script>
</body>
</html>
